name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Overrides the repo's .python-version for every uv command in this job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run python -m ruff check .

      - name: Check formatting
        run: uv run python -m ruff format --check .

      # data/repos/ is gitignored, so the FastAPI clone is absent in CI. Tests that
      # need it must skip themselves when it is missing; none do today.
      - name: Test
        run: uv run python -m pytest
